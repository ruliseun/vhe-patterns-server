# Authentication endpoints in YAML format

# Create Organisation Endpoint
/auth/create_organisation:
  post:
    tags:
      - Authentication
    summary: Create a new organisation
    description: Creates a new organisation with provided details and an owner profile.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              orgName:
                type: string
                description: Name of the organisation
              orgEmail:
                type: string
                format: email
                description: Email address of the organisation
              orgType:
                type: string
                description: Type of the organisation (optional)
              orgSize:
                type: string
                description: Size of the organisation
              address:
                type: string
                description: Address of the organisation
              owner:
                type: object
                properties:
                  firstName:
                    type: string
                    description: Owner's first name
                  lastName:
                    type: string
                    description: Owner's last name
                  email:
                    type: string
                    format: email
                    description: Owner's email address
                  country:
                    type: string
                    description: Owner's country
                required:
                  - firstName
                  - lastName
                  - email
                  - country
              password:
                type: string
                description: Password for the organisation owner
              country:
                type: string
                description: Country of the organisation (optional)
            required:
              - orgName
              - orgEmail
              - orgSize
              - address
              - owner
              - password
    responses:
      200:
        description: Organisation created successfully
      500:
        description: Error creating organisation

# Login Endpoint
/auth/login:
  post:
    tags:
      - Authentication
    summary: Log in a user
    description: Authenticates a user and returns a token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                description: User's email address
              password:
                type: string
                description: User's password
              deviceType:
                type: string
                enum: [WEB, APP]
                description: Device type (optional, defaults to WEB)
            required:
              - email
              - password
    responses:
      200:
        description: Login successful
      500:
        description: Error during login

# Logout Endpoint
/auth/logout:
  post:
    tags:
      - Authentication
    summary: Log out a user
    description: Logs out a user and clears session tokens.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              deviceType:
                type: string
                enum: [WEB, APP]
                description: Device type (optional, defaults to WEB)
    responses:
      200:
        description: User logged out successfully
      500:
        description: Error logging out user

# Token Refresh Endpoint
/auth/token:
  post:
    tags:
      - Authentication
    summary: Refresh access token
    description: Refreshes an access token using a refresh token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
                description: Refresh token
            required:
              - token
    responses:
      200:
        description: Session refreshed successfully
      500:
        description: Error refreshing token

# Invite Link Endpoint
/auth/invite_link:
  get:
    tags:
      - Authentication
    summary: Get organisation invite link
    description: Retrieves an invite link for an organisation (Admin/Super Admin only).
    responses:
      200:
        description: Invite link retrieved successfully
      500:
        description: Error fetching invite link

# User Registration Endpoint
/auth/register:
  post:
    tags:
      - Authentication
    summary: Register a new user
    description: Creates a new user account with an invite code.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              inviteCode:
                type: string
                description: Invite code for registration
              firstName:
                type: string
                description: User's first name
              middleName:
                type: string
                description: User's middle name
              lastName:
                type: string
                description: User's last name
              email:
                type: string
                format: email
                description: User's email address
              phone:
                type: string
                description: User's phone number (optional)
              country:
                type: string
                description: User's country (optional)
              state:
                type: string
                description: User's state (optional)
              city:
                type: string
                description: User's city (optional)
              address:
                type: string
                description: User's address (optional)
              dob:
                type: string
                description: User's date of birth (optional)
              ageRange:
                type: string
                description: User's age range, e.g., '20-30' (optional)
              password:
                type: string
                description: User's password (optional, min 8 characters, must include uppercase, lowercase, number, and special character)
              gender:
                type: string
                enum: [MALE, FEMALE, OTHER]
                description: User's gender (optional)
              maritalStatus:
                type: string
                enum: [SINGLE, MARRIED, DIVORCED, WIDOWED]
                description: User's marital status (optional)
              consent:
                  type: boolean
                  description: Consent given by the member
              guardianSupervisionConsent:
                  type: boolean
                  description: Guardian supervision consent for minors
            required:
              - inviteCode
              - firstName
              - lastName
              - email
    responses:
      200:
        description: User created successfully
      500:
        description: Error creating user

# Ward Registration Endpoint
/auth/register/wards:
  post:
    tags:
      - Authentication
    summary: Register a user ward
    description: Creates a new user as a child of existing user.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              guardianCode:
                type: string
                description: Guardian code for registration
              firstName:
                type: string
                description: User's first name
              middleName:
                type: string
                description: User's middle name
              lastName:
                type: string
                description: User's last name
              email:
                type: string
                format: email
                description: User's email address (optional)
              phone:
                type: string
                description: User's phone number (optional)
              country:
                type: string
                description: User's country (optional)
              state:
                type: string
                description: User's state (optional)
              city:
                type: string
                description: User's city (optional)
              address:
                type: string
                description: User's address (optional)
              dob:
                type: string
                description: User's date of birth (optional)
              ageRange:
                type: string
                description: User's age range, e.g., '20-30' (optional)
              gender:
                type: string
                enum: [MALE, FEMALE]
                description: User's gender (optional)
              maritalStatus:
                type: string
                enum: [SINGLE, MARRIED, DIVORCED, WIDOWED]
                description: User's marital status (optional)
            required:
              - guardianCode
              - firstName
              - lastName
    responses:
      200:
        description: User created successfully
      500:
        description: Error creating user

# Forgot Password Endpoint
/auth/forgot_password:
  post:
    tags:
      - Authentication
    summary: Request password reset
    description: Sends a password reset OTP to the user's email.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                description: User's email address
            required:
              - email
    responses:
      200:
        description: Password reset OTP sent successfully
      500:
        description: Error requesting password reset

# Reset Password Endpoint
/auth/reset_password:
  post:
    tags:
      - Authentication
    summary: Reset user password
    description: Resets the user's password using an OTP code.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                description: User's email address
              code:
                type: string
                description: OTP code for password reset
              password:
                type: string
                description: New password (min 8 characters, must include uppercase, lowercase, number, and special character)
            required:
              - email
              - code
              - password
    responses:
      200:
        description: Password reset successfully
      500:
        description: Error resetting password

# Email Verification Endpoint
/auth/email_verification:
  post:
    tags:
      - Authentication
    summary: Send email verification
    description: Sends a verification email to the authenticated user.
    responses:
      200:
        description: Verification email sent successfully
      500:
        description: Error sending verification email

# Resend QR code 
/auth/send_qrcode:
  post:
    tags:
      - Authentication
    summary: Resend QR code
    description: Resends a QR code to Active users.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: array
                items:
                  type: string
                description: User(s) email address
    responses:
      200:
        description: QR Code sent successfully
      500:
        description: Error sending QR code

# Resend Verification Email Endpoint
/auth/send_verification:
  post:
    tags:
      - Authentication
    summary: Resend verification email
    description: Resends a verification email to a specified email address.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: array
                items:
                  type: string
                description: User(s) email address
    responses:
      200:
        description: Verification email sent successfully
      500:
        description: Error sending verification email

# Verify Email with Token Endpoint
/auth/verify/{token}:
  get:
    tags:
      - Authentication
    summary: Verify email with token
    description: Verifies a user's email using a token.
    parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
        description: Email verification token
    responses:
      200:
        description: Email verified successfully
      500:
        description: Error verifying email

# Update Organisation Endpoint
/auth/update_org:
  patch:
    tags:
      - Authentication
    summary: Update organisation details
    description: Updates organisation details, including optional logo upload (Admin only).
    requestBody:
      required: false
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Organisation name (optional)
              type:
                type: string
                description: Organisation type (optional)
              size:
                type: string
                description: Organisation size (optional)
              website:
                type: string
                description: Organisation website URL (optional)
              address:
                type: string
                description: Organisation address (optional)
              country:
                type: string
                description: Organisation country (optional)
              logo:
                type: string
                format: binary
                description: Organisation logo file (optional)
    responses:
      200:
        description: Organisation updated successfully
      400:
        description: No data to update
      500:
        description: Error updating organisation
# Request OTP Endpoint
/auth/request/otp:
  post:
    tags:
      - Authentication
    summary: Request OTP
    description: Requests an OTP for authentication purposes.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                description: User's email address
              requestId:
                type: string
                description: Request identifier (optional)
            required:
              - email
    responses:
      200:
        description: OTP requested successfully
      500:
        description: Error requesting OTP

# Validate OTP Endpoint
/auth/validate/otp:
  post:
    tags:
      - Authentication
    summary: Validate OTP
    description: Validates an OTP for authentication.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              otp:
                type: string
                description: OTP code
              requestId:
                type: string
                description: Request identifier
              auth:
                type: boolean
                description: Authentication flag (optional)
            required:
              - otp
              - requestId
    responses:
      200:
        description: OTP validated successfully
      500:
        description: Error validating OTP