version: '3.9'
services:
  vhepatterns-container:
    image: ruliseun/vhepatterns:latest
    ports:
      - 3012:3012
      - 1025:1025
      - 1080:1080
    deploy:
      resources:
        limits:
          memory: 1000m
          cpus: '0.3'
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
